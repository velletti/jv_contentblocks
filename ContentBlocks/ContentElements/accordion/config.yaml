name: jvelletti/accordion
group: common
fields:
  - identifier: header
    useExistingField: true

  - identifier: accordion_item
    type: Collection
    labelField: text
    minitems: 1
    fields:
      - identifier: text
        type: Text
      - identifier: textarea
        type: Textarea
        enableRichtext: true


  - identifier: settings
    type: Tab
  - identifier: pi_flexform
    useExistingField: true
    type: FlexForm
    fields:
      - identifier: jvelletti/AccordeonStyle
        type: Basic
  - identifier: jvelletti/Appearance
    type: Basic