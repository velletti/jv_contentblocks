name: jvelletti/accordiongroup
group: common
fields:
  - identifier: header
    useExistingField: true
  - identifier: header_layout
    useExistingField: true
    default: 2


  - identifier: accordions
    type: Relation
    allowed: 'tt_content'
    maxitems: 10
    suggestOptions:
      default:
        additionalSearchFields: 'header, id'
  - identifier: settings
    type: Tab
  - identifier: pi_flexform
    useExistingField: true
    type: FlexForm
    fields:
      - identifier: hasSubAccordeon
        label: hasSubAccordeon
        type: Checkbox
        default: 1
      - identifier: defaultRendering
        label: defaultRendering
        description: User Default rendering to seerendered bodytext of an element
        type: Checkbox
        default: 0
      - identifier: jvelletti/AccordeonStyle
        type: Basic

  - identifier: jvelletti/Appearance
    type: Basic



